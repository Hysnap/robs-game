[map_layout]
default_city_radius = 14
default_radial_jitter = 0.35
enable_building_spawning = false

; --- CIVIC ANCHORS TOGGLES ---
spawn_local_government = true
spawn_hospital = true
spawn_university = true

; --- SPATIAL SCALING & NOISE ---
boundary_noise_scale = 15.0
zoning_noise_scale = 8.0

[shift_parameters]
max_daily_shift_minutes = 480.0    ; 8-hour active operational shift
overtime_allowed = true
overtime_fatigue_penalty = 15.0    ; Working beyond 480 mins spikes exhaustion

[society]
manifest_path="res://data_modules/core/spatial/society/society_manifest_1980s_midlands.json"

[starting_finances]
liquid_cash = 100.00
clean_bank_balance = 0.00
debt_balance = 0.00

[starting_operations]
fatigue = 0.0
active_device = "LANDLINE_BOOTH"
; startiing home ward anchor (e.g. Center-South residential Terrace)
home_district_id = "block_0_-3"

[starting_metadata]
current_tick = 0
days_per_tick = 7              ; 1 turn = 1 week
default_seed = "default-city"

[survey_mechanics]
base_scout_cost = 5.00		; Bus face, tea, and local phone calls
base_scout_duratiion_ticks = 1	; Takes 1 week/tick for runner to walk the area
scout_stale_threshold_ticks = 4 ; after 4 weeks , ink notes become stale pencil

[system_diagnostics]
# Minimum level to log: "DEBUG", "INFO", "WARN", "ERROR", "CRITICAL"
log_level = "DEBUG"
# Write full session output to disk (user://session_output.log)
enable_file_logging = true
# Enable runtime post-generation telemetry and health audit
enable_generation_audit = true
session_log_path = "user://session_output.log"
# Fail hard on sanity check violations during startup
strict_audit_mode = true
enable_startup_audit = true
write_audit_to_disk = true
strict_halt_on_error = true
enable_generation_progress_log = true   ; If false, mutes generation feedback completely
ground_batch_log_interval = 50          ; Print/yield every N blocks (prevents Godot char overflow)
yield_per_batch = true                  ; Yield to process_frame to keep UI responsive

[travel_fallback_hierarchy]
; Ordered from most preferred/expensive to cheapest/fallback
tier_1 = "SERVICE_BLACK_CAB"
tier_2 = "SERVICE_MINI_CAB"
tier_3 = "SERVICE_BUS_TRANSIT"
tier_4 = "SERVICE_WALK"          ; Universal zero-cost fallback (free, maximum time & fatigue)
