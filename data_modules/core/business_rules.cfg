[catalogs]
commodities_root = "res://data_modules/core/commodities/"
recipes_root = "res://data_modules/core/recipes/"
transports_root = "res://data_modules/core/commodities/services/transport/"

[city_generation]
; Pipeline execution mode: "REWORKED_DEFERRED_INDEX" or "LEGACY_ORDER"
pipeline_mode = "REWORKED_DEFERRED_INDEX"
; Defer secondary SQLite indexes until post-insert waves (true = faster bulk inserts)
defer_secondary_indexes = true
; Number of districts processed per SQLite batch flush during premises/household creation
district_batch_size = 25
; Maximum SQL statements buffered per SQLite transaction flush during large population passes
sql_flush_batch_size = 1000
; Number of households hydrated per SQLite flush batch
household_flush_batch_size = 250
; Ordered stage sequence executed when pipeline_mode = "REWORKED_DEFERRED_INDEX"
stage_order = ["DISTRICTS_AND_CIVICS", "RESIDENTIAL_AND_HOUSEHOLDS", "INDEX_WAVE_HOUSEHOLDS_RESIDENTS", "COMMERCIAL_INDUSTRIAL_AND_SLOTS", "INDEX_WAVE_ESTABS_SLOTS", "ALLOCATE_ROLES_AND_HOUSING", "SOCIAL_AND_DUNBAR", "INDEX_WAVE_REMAINING"]

[generation_pacing]
; Exponential moving average smoothing factor (0.0 - 1.0) for self-calibrating loading bar weights
ema_alpha = 0.35
; Seed baseline stage shares (automatically normalized and updated in user://gen_telemetry.json)
weight_streets = 0.18
weight_districts = 0.03
weight_society_premises = 0.16
weight_society_citizens = 0.44
weight_society_dunbar = 0.12
weight_roster = 0.03
weight_save = 0.04

[labor_market]
; When false, bypasses archetype/demographic unemployment rolls so all working-age citizens seek work
enable_archetype_unemployment = false
; When false, workers ignore commute distance decay and will take any open matching job across the map
enable_commute_distances = false
; When false, workers are not restricted to COMMERCIAL vs INDUSTRIAL and can claim any available category slot
enable_category_restricted_hunting = false

[map_layout]
default_city_radius = 14
default_radial_jitter = 0.35

enable_building_spawning = false

; --- CIVIC ANCHORS TOGGLES ---
spawn_local_government = true
spawn_hospital = true
spawn_university = true

; --- SPATIAL SCALING & NOISE ---
boundary_noise_scale = 15.0
zoning_noise_scale = 8.0

; --- CORE TOLERANCE ---
core_distance_tolerance = 0.08

[society]
manifest_path="res://data_modules/core/spatial/society/society_manifest_1980s_midlands.json"
default_db_path = "user://game_society.db"

[spatial_influence]
; Horizon evaluation mode: "DISTANCE_METERS" (future: "TRAVEL_TIME_MINUTES")
radius_mode = "DISTANCE_METERS"
; Moving circle-of-influence radius for extended kinship clan weaving (meters)
kinship_clan_radius_m = 1500.0
; Circle-of-influence radius around an organization's HQ for baseline commercial street awareness (meters)
org_hq_commercial_radius_m = 1500.0

[system_diagnostics]
# Minimum level to log: "DEBUG", "INFO", "WARN", "ERROR", "CRITICAL"
log_level = "DEBUG"
# Write full session output to disk (user://session_output.log)
enable_file_logging = true
# Also emit logger output to the Godot console. Set false for file-only logging.
enable_console_logging = true
# Enable runtime post-generation telemetry and health audit
enable_generation_audit = true
session_log_path = "user://session_output.log"
# Fail hard on sanity check violations during startup
strict_audit_mode = true
enable_startup_audit = true
write_audit_to_disk = true
strict_halt_on_error = true
enable_generation_progress_log = true   ; If false, mutes generation feedback completely
ground_batch_log_interval = 50          ; Print/yield every N blocks (prevents Godot char overflow)
yield_per_batch = true                  ; Yield to process_frame to keep UI responsive

[turn_execution]
strict_fifo_halt_on_failure = true    ; If true, any failed directive aborts downstream orders for that shift